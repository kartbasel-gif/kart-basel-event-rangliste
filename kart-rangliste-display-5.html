<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kart Basel — Qualification Ranking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --kb-bg: #0b0b0c;
    --kb-surface: #141416;
    --kb-surface-2: #1b1b1e;
    --kb-border: #26262a;
    --kb-border-soft: #1e1e21;
    --kb-text: #f3f3f4;
    --kb-text-dim: #9a9aa0;
    --kb-text-faint: #808088;
    --kb-red: #d51625;
    --kb-red-dim: #6e0f17;
    --kb-green: #1fb15b;
    --kb-green-bg: rgba(31,177,91,0.12);
    --kb-amber: #e0912a;
    --kb-amber-bg: rgba(224,145,42,0.14);
    --kb-danger: #d51625;
    --kb-danger-bg: rgba(213,22,37,0.14);
    --kb-purple: #9d6bff;
    --row-h: 56px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    background: var(--kb-bg);
    color: var(--kb-text);
    margin: 0;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: #000;
    border-bottom: 2px solid var(--kb-red);
  }
  .site-header__inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 6px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  #currentEvent, #ranking, #findYourResult { scroll-margin-top: 90px; }
  .brand { display: flex; align-items: center; }
  .brand__logo {
    display: block;
    height: 64px;
    width: auto;
  }
  @media (max-width: 640px) {
    .brand__logo { height: 50px; }
  }
  .header-actions { display: flex; align-items: center; gap: 12px; }
  .menu-btn {
    width: 42px; height: 42px;
    border-radius: 8px;
    border: 1px solid var(--kb-border);
    background: var(--kb-surface);
    color: var(--kb-text);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .menu-btn:hover { border-color: var(--kb-red); background: var(--kb-surface-2); }

  /* ---------- Hamburger menu panel ---------- */
  .menu-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 90;
  }
  .menu-overlay.open { opacity: 1; pointer-events: auto; }
  .menu-panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(340px, 86vw);
    background: #0a0a0b;
    border-left: 2px solid var(--kb-red);
    transform: translateX(100%);
    transition: transform 0.22s ease;
    z-index: 100;
    display: flex; flex-direction: column;
  }
  .menu-panel.open { transform: translateX(0); }
  .menu-panel__head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px;
    border-bottom: 1px solid var(--kb-border);
    font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
    color: var(--kb-text-dim);
  }
  .menu-close {
    border: none; background: none; color: var(--kb-text-dim);
    font-size: 20px; cursor: pointer; line-height: 1;
  }
  .menu-close:hover { color: var(--kb-text); }
  .menu-list { padding: 10px 12px 24px; overflow-y: auto; }
  .menu-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%;
    padding: 13px 12px;
    border: none; border-radius: 8px;
    background: none;
    color: var(--kb-text);
    font-family: inherit; font-size: 14px; font-weight: 700;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .menu-item:hover { background: var(--kb-surface-2); }
  .menu-item.active { background: var(--kb-surface-2); box-shadow: inset 3px 0 0 var(--kb-red); }
  .menu-item .menu-item__meta { font-size: 11px; color: var(--kb-text-faint); font-weight: 600; white-space: nowrap; }
  .menu-section-title {
    margin: 18px 12px 6px;
    font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--kb-text-faint);
  }
  .menu-sub { padding-left: 8px; }
  .menu-sub .menu-item { font-weight: 600; font-size: 13.5px; }
  .menu-empty { padding: 8px 12px; font-size: 12.5px; color: var(--kb-text-faint); }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--kb-surface);
    border: 1px solid var(--kb-border);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--kb-text-dim);
    flex-shrink: 0;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--kb-text-faint);
  }
  .status-pill.is-live { color: #bdf5d4; border-color: rgba(31,177,91,0.35); background: var(--kb-green-bg); }
  .status-pill.is-live .status-dot {
    background: var(--kb-green);
    animation: live-pulse 1.6s ease-in-out infinite;
  }
  @keyframes live-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(31,177,91,0.55); }
    50% { box-shadow: 0 0 0 4px rgba(31,177,91,0); }
  }
  .status-pill.is-final { color: #d8d8da; border-color: var(--kb-border); }

  /* ---------- Hero ---------- */
  .hero {
    border-bottom: 1px solid var(--kb-border);
    background:
      radial-gradient(900px 260px at 50% -120px, rgba(213,22,37,0.14), transparent 70%),
      #0f0f11;
  }
  .hero__inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 30px 20px 22px;
  }
  .hero__eyebrow {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--kb-red);
    margin-bottom: 8px;
  }
  .hero__title {
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 0 0 6px;
    line-height: 1.15;
  }
  .hero__meta {
    font-size: 13px;
    color: var(--kb-text-dim);
    font-weight: 500;
    margin-bottom: 18px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 600;
    color: var(--kb-text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .legend-dot {
    width: 9px; height: 9px;
    border-radius: 3px;
  }
  .legend-item.safe .legend-dot { background: var(--kb-green); }
  .legend-item.warn .legend-dot { background: var(--kb-amber); }
  .legend-item.elim .legend-dot { background: var(--kb-danger); }

  /* ---------- Main / toolbar ---------- */
  .main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 22px 20px 60px;
  }
  .toolbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .table-title {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--kb-border);
    background: linear-gradient(90deg, rgba(213,22,37,0.16), transparent 55%);
  }
  .table-title__label {
    font-size: 20px; font-weight: 900; letter-spacing: 1.5px;
    text-transform: uppercase;
    border-left: 4px solid var(--kb-red);
    padding-left: 10px;
    line-height: 1.1;
  }
  .hero__back {
    margin: 0 0 16px;
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--kb-border);
    background: var(--kb-surface);
    color: var(--kb-text);
    font-family: inherit; font-size: 12px; font-weight: 700;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .hero__back:hover { border-color: var(--kb-red); }

  .search-wrap { width: 100%; max-width: 420px; }
  .search-help { margin: 0 0 9px; font-size: 13px; color: var(--kb-text-dim); }
  .search-label {
    display: block;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--kb-text-faint);
    margin-bottom: 6px;
  }
  .search-field-wrap { position: relative; }
  .search-input-field {
    width: 100%;
    min-height: 46px;
    padding: 11px 14px;
    border-radius: 8px;
    border: 1px solid var(--kb-border);
    background: var(--kb-surface);
    color: var(--kb-text);
    font-family: inherit;
    font-size: 16px; /* 16px verhindert das automatische Hineinzoomen auf iPhones */
  }
  .search-input-field::placeholder { color: var(--kb-text-faint); }
  .search-input-field:focus { outline: none; border-color: var(--kb-red); }

  .search-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 40;
    background: var(--kb-surface-2);
    border: 1px solid var(--kb-border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(0,0,0,0.5);
  }
  .search-dropdown.open { display: block; }
  .search-dropdown-item {
    padding: 11px 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--kb-text);
    cursor: pointer;
    border-bottom: 1px solid var(--kb-border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .search-dropdown-item:last-child { border-bottom: none; }
  .search-dropdown-item:hover, .search-dropdown-item:focus-visible { background: rgba(255,255,255,0.07); outline: none; }
  .search-dropdown-item .sdi-pos {
    font-size: 11px;
    font-weight: 800;
    color: var(--kb-text-faint);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- "Your Result" card ---------- */
  .result-card {
    margin-bottom: 18px;
    padding: 18px 20px 16px;
    border-radius: 12px;
    background: var(--kb-surface);
    border: 1px solid var(--kb-border);
    border-left: 4px solid var(--kb-text-faint);
    animation: result-fade 0.18s ease-out;
  }
  @keyframes result-fade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: translateY(0); } }
  .result-card.safe { border-left-color: var(--kb-green); }
  .result-card.warn { border-left-color: var(--kb-amber); }
  .result-card.elim { border-left-color: var(--kb-danger); }

  .result-eyebrow {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--kb-text-faint);
    margin-bottom: 10px;
  }
  .result-headline {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .result-rank {
    font-size: 28px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .result-card.safe .result-rank { color: var(--kb-green); }
  .result-card.warn .result-rank { color: var(--kb-amber); }
  .result-card.elim .result-rank { color: var(--kb-danger); }
  .result-name { font-size: 19px; font-weight: 800; }

  .result-stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 14px;
  }
  .result-stat-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--kb-text-faint);
    margin-bottom: 3px;
  }
  .result-stat-value {
    font-size: 16px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .result-stat-value.is-status { font-size: 13px; }

  .result-none {
    text-align: center;
    color: var(--kb-text-dim);
    font-size: 13px;
    padding: 16px 0;
    border: 1px dashed var(--kb-border);
    border-radius: 12px;
    margin-bottom: 18px;
  }

  /* ---------- Table ---------- */
  .table-card {
    border: 1px solid var(--kb-border);
    border-radius: 12px;
    background: var(--kb-surface);
    overflow: hidden;
  }
  .row-grid {
    display: grid;
    grid-template-columns: 58px minmax(0,1fr) 84px 84px 108px 118px;
    column-gap: 14px;
    align-items: center;
  }
  .list-head {
    padding: 12px 18px;
    background: var(--kb-surface-2);
    border-bottom: 1px solid var(--kb-border);
    color: var(--kb-text-faint);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }
  .lh-time, .lh-gap, .lh-int { text-align: right; }
  .lh-status { text-align: right; }

  .list { display: flex; flex-direction: column; }
  .entry {
    padding: calc(var(--row-h) * 0.16) 18px;
    border-bottom: 1px solid var(--kb-border-soft);
    background: var(--kb-surface);
    transition: background 0.15s ease;
  }
  .entry:last-child { border-bottom: none; }
  .entry:hover { background: var(--kb-surface-2); }
  .entry.p1 { background: linear-gradient(90deg, rgba(157,107,255,0.07), transparent 40%); }

  .col-pos {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: max(17px, calc(var(--row-h) * 0.34));
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--kb-text-dim);
  }
  .entry.safe .col-pos { color: var(--kb-green); }
  .entry.warn .col-pos { color: var(--kb-amber); }
  .entry.elim .col-pos { color: var(--kb-danger); }

  .pos-arrow { display: inline-block; min-width: 24px; white-space: nowrap; font-size: max(10px, calc(var(--row-h) * 0.22)); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .pos-arrow.up { color: var(--kb-green); }
  .pos-arrow.down { color: var(--kb-danger); }
  .pos-arrow.neutral { color: var(--kb-text-faint); }

  .col-driver { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .driver-row { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .driver-name {
    font-size: max(15px, calc(var(--row-h) * 0.26));
    font-weight: 700;
    white-space: normal;
    overflow-wrap: break-word;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-safe { color: #bdf5d4; background: var(--kb-green-bg); }
  .badge-warn { color: #ffe2b0; background: var(--kb-amber-bg); }
  .badge-elim { color: #ffc2c6; background: var(--kb-danger-bg); }
  .badge-fastest { color: #e6dbff; background: rgba(157,107,255,0.16); }

  .driver-meta-mobile {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--kb-text-dim);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  .col-gap, .col-int {
    text-align: right;
    font-size: max(12px, calc(var(--row-h) * 0.18));
    color: var(--kb-text-dim);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .col-time {
    text-align: right;
    font-size: max(15px, calc(var(--row-h) * 0.26));
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .col-time.no-time { color: var(--kb-text-faint); font-weight: 500; }
  .col-status { text-align: right; }

  .section-label {
    padding: 9px 18px;
    background: var(--kb-surface-2);
    border-bottom: 1px solid var(--kb-border);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .section-label--qual { color: #9fe6bd; }


  .empty {
    text-align: center;
    color: var(--kb-text-dim);
    padding: 54px 20px;
    font-size: 14px;
  }

  /* ---------- Responsive: collapse secondary columns on small screens ---------- */
  @media (max-width: 820px) {
    .row-grid { grid-template-columns: 48px minmax(0,1fr) auto; column-gap: 10px; }
    .pos-arrow { min-width: 20px; }
    .fullscreen-btn { width: 34px; height: 34px; bottom: 14px; right: 12px; opacity: 0.6; }
    .lh-gap, .lh-int, .lh-status, .col-gap, .col-int, .col-status { display: none; }
    .driver-meta-mobile { display: flex; }
  }

  .entry.dimmed { opacity: 0.3; }

  /* ---------- Neu: Zuletzt aktualisiert, Zusammenfassung, Battle Zone, Treffer-Hervorhebung ---------- */
  [hidden] { display: none !important; }
  .hero__updated { margin: -12px 0 18px; font-size: 12px; font-weight: 600; color: var(--kb-text-faint); font-variant-numeric: tabular-nums; }

  /* Bestzeit nur als kleiner Hinweis im Titelbalken — erscheint ausschliesslich bei echter Zeit */
  .table-title__best { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--kb-text-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table-title__best b { margin-left: 5px; font-size: 14px; font-weight: 800; color: var(--kb-text); }
  @media (max-width: 520px) { .table-title__best { display: none; } }

  /* Zonen-Trenner (Battle zone + Elimination zone): EIN gemeinsames Muster; die Farbe wird pro Zone separat gesetzt (--zone-line / --zone-text) */
  .zone-line { display: flex; align-items: center; gap: 12px; padding: 8px 18px; background: var(--kb-surface); border-bottom: 1px solid var(--kb-border-soft); }
  .zone-line::before, .zone-line::after { content: ""; flex: 1; height: 1px; background: var(--zone-line); }
  .zone-line__label { font-size: 10.5px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--zone-text); white-space: nowrap; }
  .zone-line--elim   { --zone-line: #d51625; --zone-text: #d51625; }  /* dasselbe Kart-Basel-Rot wie die Battle zone */

  .col-gap.is-leader { font-size: 11px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: var(--kb-text-dim); }
  .entry.found { background: linear-gradient(90deg, rgba(213,22,37,0.20), rgba(213,22,37,0.06)); box-shadow: inset 3px 0 0 var(--kb-red); }

  .qmeter { margin-top: 16px; max-width: 420px; }
  .qmeter__bar { display: flex; gap: 3px; margin: 5px 0 6px; }
  .qseg { flex: 1 1 0; min-width: 3px; height: 7px; border-radius: 2px; background: rgba(31,177,91,0.22); }
  .qseg.me { background: var(--kb-green); box-shadow: 0 0 0 2px rgba(255,255,255,0.18); }
  .qseg.me.warn { background: var(--kb-amber); }
  .qmeter__text { font-size: 13px; font-weight: 700; color: var(--kb-text-dim); font-variant-numeric: tabular-nums; }

  .menu-item.menu-event { flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--kb-border); }
  .menu-event__name { font-size: 14.5px; font-weight: 700; overflow-wrap: break-word; }
  .menu-event__meta { font-size: 12px; color: var(--kb-text-dim); font-weight: 500; }
  .menu-event__cta { margin-top: 4px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.4px; color: var(--kb-red); }

  /* Sehr kleine Handys (≤360px): etwas engere Abstände, damit auch sehr lange Namen komplett und ohne Wortbruch passen */
  @media (max-width: 360px) {
    .main { padding-left: 12px; padding-right: 12px; }
    .entry, .list-head { padding-left: 12px; padding-right: 12px; }
    .row-grid { grid-template-columns: 44px minmax(0,1fr) auto; column-gap: 8px; }
    .driver-name { font-size: 14px; }
    .col-time { font-size: 14px; }
  }

  /* ---------- Fullscreen toggle ---------- */
  .fullscreen-btn {
    position: fixed;
    bottom: 18px;
    right: 18px;
    z-index: 60;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--kb-border);
    background: var(--kb-surface);
    color: var(--kb-text-dim);
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .fullscreen-btn:hover { color: var(--kb-text); border-color: var(--kb-red); opacity: 1; }

  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="site-header">

    <button class="menu-item" id="menuCurrent" onclick="goCurrentEvent()">Current Event</button>
    <button class="menu-item" onclick="goFindResult()">Find Your Result</button>
    <div class="menu-section-title">Past Events</div>
    <div class="menu-sub" id="menuEvents"></div>
  </nav>
</aside>

<section class="hero" id="currentEvent">
  <div class="hero__inner">
    <div class="hero__eyebrow">Qualification</div>
    <h1 class="hero__title" id="heroTitle">Live Ranking</h1>
    <div class="hero__meta" id="heroMeta">Waiting for data…</div>
    <div class="hero__updated" id="heroUpdated" hidden></div>
    <button class="hero__back" id="heroBack" onclick="goCurrentEvent()" style="display:none">&larr; Back to current event</button>
    <div class="legend">
      <span class="legend-item safe"><span class="legend-dot"></span>Qualified</span>
      <span class="legend-item warn"><span class="legend-dot"></span>At Risk</span>
      <span class="legend-item elim"><span class="legend-dot"></span>Eliminated</span>
    </div>
  </div>
</section>

<div class="main">
  <div class="toolbar">
    <div class="search-wrap" id="findYourResult">
      <label class="search-label" for="searchInput">Find Your Result</label>
      <p class="search-help">Type your name to see your position, time and status.</p>
      <div class="search-field-wrap">
        <input id="searchInput" class="search-input-field" type="text" placeholder="🔍 Type your name…" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Driver name" oninput="applySearchFilter(this.value)" onkeydown="handleSearchKeydown(event)">
        <div class="search-dropdown" id="searchDropdown"></div>
      </div>
    </div>

  </div>

  <div id="searchResultCard"></div>

  <div class="table-card" id="ranking">
    <div class="table-title"><span class="table-title__label" id="topLabel">TOP 20</span><span class="table-title__best" id="bestChip" hidden>Best time<b></b></span></div>
    <div class="list-head row-grid" id="listHead">
      <div class="lh-pos">Pos</div>
      <div class="lh-name">Driver</div>
      <div class="lh-gap">Gap</div>
      <div class="lh-int">Int</div>
      <div class="lh-time">Time</div>
      <div class="lh-status">Status</div>
    </div>
    <div class="list" id="list"></div>
    <div class="empty" id="emptyMsg">Waiting for the first times.</div>
  </div>
</div>

<button class="fullscreen-btn" id="fsBtn" onclick="toggleFullscreen()" title="Full screen" aria-label="Full screen">⛶</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAdo5UMvb5djezX6tF_78OlnwMrNl270lc",
    authDomain: "kart-basel.firebaseapp.com",
    databaseURL: "https://kart-basel-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "kart-basel",
    storageBucket: "kart-basel.firebasestorage.app",
    messagingSenderId: "633928437253",
    appId: "1:633928437253:web:4c77da7b44e7547478d66c"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const dbRef = db.ref("kartBasel/rangliste");

  let people = [];
  let livePeople = [];
  let liveQualifyCount = 7;
  let qualifyCount = 7; // aktuell aktiver Wert (je nach Tab)
  let archivedEvents = []; // [{id, name, people, qualifyCount, createdAt}]
  let activeTab = 'live'; // 'live' oder event-id
  let searchFilter = ''; // aktueller Such-Text (klein geschrieben)
  let unsubscribeLive = null;
  // Positionswechsel: Vergleich NUR mit dem vorherigen echten Daten-Update (kein erfundener Verlauf)
  let prevLivePositions = null; // name (lowercase) -> Platz-Index beim vorherigen Update (null = noch kein Vorzustand)
  let liveMovement = null;      // name (lowercase) -> { delta } | { isNew } für das letzte Update; null = kein Vergleich möglich
  let liveUpdatedAt = null;     // Zeitstempel, den die Admin-Seite beim Speichern mitschreibt
  let liveQualifyKnown = false; // true nur, wenn die Admin-Seite eine Qualifikationszahl gespeichert hat
  let qualifyKnown = false;     // dasselbe für das gerade angezeigte Event (alte Events können sie nicht haben)
  let archiveState = 'loading'; // 'loading' | 'ok' | 'error' — damit eine leere Liste nie fälschlich "keine Events" meldet

  function startLiveListener() {
    if (unsubscribeLive) return;
    unsubscribeLive = true;
    dbRef.on('value', (snap) => {
      const val = snap.val();
      livePeople = normalizePeople(val && val.people);
      liveQualifyCount = (val && val.qualifyCount) ? val.qualifyCount : 7;
      liveQualifyKnown = !!(val && val.qualifyCount);
      liveUpdatedAt = (val && val.updatedAt) ? val.updatedAt : null;
      trackMovement(livePeople);
      if (activeTab === 'live') {
        people = livePeople;
        qualifyCount = liveQualifyCount;
        qualifyKnown = liveQualifyKnown;
        render();
      }
    }, (err) => {
      console.error('Firebase-Fehler (live):', err);
    });
  }

  // Liest Fahrerlisten robust ein: Firebase liefert Listen manchmal als Objekt, und leere Werte
  // (z.B. timeSec: null) werden gar nicht gespeichert. Es entsteht nur eine Anzeige-Kopie — die Datenbank wird nie verändert.
  function normalizePeople(raw) {
    if (!raw) return [];
    let items;
    if (Array.isArray(raw)) {
      items = raw;
    } else if (typeof raw === 'object') {
      const keys = Object.keys(raw);
      if (keys.every(k => /^\d+$/.test(k))) keys.sort((a, b) => a - b);
      items = keys.map(k => raw[k]);
    } else {
      return [];
    }
    return items
      .filter(p => p && typeof p === 'object' && p.name !== undefined && p.name !== null && String(p.name).trim() !== '')
      .map(p => {
        const t = (typeof p.timeSec === 'string') ? parseFloat(p.timeSec) : p.timeSec;
        return { ...p, name: String(p.name), timeSec: (typeof t === 'number' && isFinite(t)) ? t : null };
      });
  }

  function hasTime(p) { return !!p && p.timeSec !== null && p.timeSec !== undefined; }

  // Berechnet die Positionsänderung seit dem vorherigen Daten-Update.
  // Beim ersten Update (oder nach einer geleerten Liste) gibt es keinen Vorzustand -> keine Anzeige.
  function trackMovement(list) {
    if (!list.length) { prevLivePositions = null; liveMovement = null; return; }
    const now = {};
    list.forEach((p, i) => { now[p.name.toLowerCase()] = i; });
    if (prevLivePositions === null) {
      liveMovement = null;
    } else {
      liveMovement = {};
      list.forEach((p, i) => {
        const k = p.name.toLowerCase();
        const prev = prevLivePositions[k];
        liveMovement[k] = prev === undefined ? { isNew: true } : { delta: prev - i };
      });
    }
    prevLivePositions = now;
  }

  function loadArchivedEvents() {
    db.ref('kartBaselEvents').on('value', (snap) => {
      archivedEvents = [];
      snap.forEach((child) => {
        const raw = child.val();
        if (!raw || typeof raw !== 'object') { return; } // nur gültige Event-Einträge
        const qc = parseInt(raw.qualifyCount, 10);
        archivedEvents.push({
          ...raw,
          id: child.key,
          name: (raw.name !== undefined && raw.name !== null && String(raw.name).trim() !== '') ? String(raw.name) : 'Untitled event',
          people: normalizePeople(raw.people),
          qualifyCount: qc > 0 ? qc : null // null = bei diesem Event wurde keine Qualifikationszahl gespeichert
        });
      });
      archivedEvents.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      archiveState = 'ok';
      renderMenu();
      if (activeTab !== 'live') {
        // Falls gerade ein archiviertes Event offen ist: dessen gespeicherten Stand neu laden
        const ev = archivedEvents.find(e => e.id === activeTab);
        people = ev ? ev.people : [];
        qualifyCount = ev && ev.qualifyCount ? ev.qualifyCount : 7;
        qualifyKnown = !!(ev && ev.qualifyCount);
        render();
      }
    }, (err) => {
      console.error('Firebase-Fehler (Archiv):', err);
      archiveState = 'error';
      renderMenu();
    });
  }

  // ---- Hamburger-Menü: Current Event / Find Your Result / Past Events (nutzt die bestehenden archivedEvents-Daten) ----
  function renderMenu() {
    document.getElementById('menuCurrent').classList.toggle('active', activeTab === 'live');

    const container = document.getElementById('menuEvents');
    container.innerHTML = '';

    if (!archivedEvents.length) {
      const empty = document.createElement('div');
      empty.className = 'menu-empty';
      empty.textContent = archiveState === 'loading' ? 'Loading past events…'
        : (archiveState === 'error' ? 'Past events could not be loaded. Check your connection and reload the page.' : 'No past events yet.');
      container.appendChild(empty);
      return;
    }

    archivedEvents.forEach((ev) => {
      const btn = document.createElement('button');
      btn.className = 'menu-item menu-event' + (activeTab === ev.id ? ' active' : '');
      const cnt = (ev.people || []).length;
      const metaText = [fmtDate(ev.createdAt), `${cnt} ${cnt === 1 ? 'driver' : 'drivers'}`].filter(Boolean).join(' · ');
      btn.innerHTML = `<span class="menu-event__name">${escapeHtml(ev.name)}</span>` +
        `<span class="menu-event__meta">${escapeHtml(metaText)}</span>` +
        `<span class="menu-event__cta">View results →</span>`;
      btn.onclick = () => openPastEvent(ev.id);
      container.appendChild(btn);
    });
  }

  function openMenu() {
    document.getElementById('menuOverlay').classList.add('open');
    document.getElementById('menuPanel').classList.add('open');
    document.getElementById('menuPanel').setAttribute('aria-hidden', 'false');
    document.getElementById('menuBtn').setAttribute('aria-expanded', 'true');
  }

  function closeMenu() {
    document.getElementById('menuOverlay').classList.remove('open');
    document.getElementById('menuPanel').classList.remove('open');
    document.getElementById('menuPanel').setAttribute('aria-hidden', 'true');
    document.getElementById('menuBtn').setAttribute('aria-expanded', 'false');
  }

  function goCurrentEvent() {
    selectTab('live');
    closeMenu();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function openPastEvent(id) {
    selectTab(id);
    closeMenu();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goFindResult() {
    closeMenu();
    const target = document.getElementById('findYourResult');
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(() => document.getElementById('searchInput').focus({ preventScroll: true }), 350);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMenu();
  });

  function selectTab(tabId) {
    activeTab = tabId;
    if (tabId === 'live') {
      people = livePeople;
      qualifyCount = liveQualifyCount;
    } else {
      const ev = archivedEvents.find(e => e.id === tabId);
      people = ev ? ev.people : [];
      qualifyCount = ev && ev.qualifyCount ? ev.qualifyCount : 7;
      qualifyKnown = !!(ev && ev.qualifyCount);
    }
    if (tabId === 'live') qualifyKnown = liveQualifyKnown;
    renderMenu();
    render();
  }

  function toggleFullscreen() {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    } else {
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    }
  }

  function formatTime(sec) {
    if (sec === null || sec === undefined) return '–';
    const min = Math.floor(sec / 60);
    const rest = (sec - min * 60);
    if (min > 0) {
      return min + ':' + rest.toFixed(3).padStart(6, '0');
    }
    return rest.toFixed(3) + 's';
  }

  // Abstand zum Vordermann (z.B. "+0.523")
  function formatGap(currentSec, prevSec) {
    if (currentSec === null || currentSec === undefined) return '';
    if (prevSec === null || prevSec === undefined) return '';
    const gap = currentSec - prevSec;
    if (gap <= 0) return '';
    return '+' + gap.toFixed(3);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function fmtDate(ts) {
    if (!ts) return '';
    return new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  // "Zuletzt aktualisiert": heute nur die Uhrzeit, sonst mit Datum
  function fmtUpdated(ts) {
    const d = new Date(ts), now = new Date();
    const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    if (d.toDateString() === now.toDateString()) return hm;
    return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '. ' + hm;
  }

  function zoneFor(i) {
    return i < qualifyCount - 1 ? 'safe' : (i === qualifyCount - 1 ? 'warn' : 'elim');
  }

  function ordinal(n) {
    const sfx = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (sfx[(v - 20) % 10] || sfx[v] || sfx[0]);
  }

  function zoneLabel(zone) {
    if (zone === 'safe') return 'Qualified';
    if (zone === 'warn') return 'At Risk';
    return 'Eliminated';
  }

  // Aktualisiert Titel/Status im Hero-Bereich oben — rein darstellend, ändert keine Logik
  function updateHeroAndStatus(driverCount) {
    const pill = document.getElementById('statusPill');
    const pillLabel = document.getElementById('statusPillLabel');
    const title = document.getElementById('heroTitle');
    const meta = document.getElementById('heroMeta');
    const backBtn = document.getElementById('heroBack');

    if (activeTab === 'live') {
      pill.className = 'status-pill is-live';
      pillLabel.textContent = 'Live';
      title.textContent = 'Live Qualifying';
      const parts = [];
      if (!driverCount) parts.push('Waiting for the first times');
      else if (qualifyKnown) {
        parts.push(`${qualifyCount} ${qualifyCount === 1 ? 'driver qualifies' : 'drivers qualify'}`);
        if (driverCount >= qualifyCount) parts.push(`${ordinal(qualifyCount)} place is at risk`);
      }
      meta.textContent = parts.length ? parts.join(' · ') : 'Live ranking';
      backBtn.style.display = 'none';
      const upd = document.getElementById('heroUpdated');
      if (liveUpdatedAt && driverCount) { upd.textContent = 'Last updated ' + fmtUpdated(liveUpdatedAt); upd.hidden = false; }
      else { upd.hidden = true; }
    } else {
      document.getElementById('heroUpdated').hidden = true;
      const ev = archivedEvents.find(e => e.id === activeTab);
      pill.className = 'status-pill is-final';
      pillLabel.textContent = 'Final';
      title.textContent = ev ? ev.name : 'Result';
      const dateStr = ev ? fmtDate(ev.createdAt) : '';
      meta.textContent = [dateStr, 'Final result', qualifyKnown ? `${qualifyCount} ${qualifyCount === 1 ? 'driver' : 'drivers'} qualified` : ''].filter(Boolean).join(' · ');
      backBtn.style.display = 'inline-block';
    }
  }

  startLiveListener();
  loadArchivedEvents();
  renderMenu();

  // ---- "Find Your Result" Suche ----
  // Arbeitet IMMER auf der vollständigen people-Liste (nicht nur den sichtbaren Top 20),
  // damit auch Fahrer ausserhalb der Top 20 ihr eigenes Ergebnis finden können.
  // Es gibt keine separate Datenquelle — dieselbe Berechnung (zone/gap/leaderGap) wie in render().

  let selectedDriverName = null; // exakter Name, sobald aus dem Dropdown ausgewählt

  function computeDriverInfo(index) {
    const p = people[index];
    const zone = index < qualifyCount - 1 ? 'safe' : (index === qualifyCount - 1 ? 'warn' : 'elim');
    const gap = index === 0 ? '' : formatGap(p.timeSec, people[index - 1].timeSec);
    const leaderGap = index === 0 ? '' : formatGap(p.timeSec, people[0].timeSec);
    const toLeader = index === 0 ? null : secDiff(p.timeSec, people[0].timeSec);
    const toAhead = index === 0 ? null : secDiff(p.timeSec, people[index - 1].timeSec);
    // Abstand zur Qualifikation — ausschliesslich aus dem Admin-Wert qualifyCount und den vorhandenen Zeiten
    let qual = null;
    if (qualifyKnown && qualifyCount >= 1) {
      if (index >= qualifyCount) {
        const d = people[qualifyCount - 1] ? secDiff(p.timeSec, people[qualifyCount - 1].timeSec) : null;
        if (d !== null) qual = { label: 'To qualification', value: fmtSec(d, true) };
      } else {
        const d = people[qualifyCount] ? secDiff(people[qualifyCount].timeSec, p.timeSec) : null;
        if (d !== null) qual = { label: 'Ahead of elimination', value: fmtSec(d, false) };
      }
    }
    return { p, i: index, zone, gap, leaderGap, toLeader, toAhead, qual };
  }

  function secDiff(a, b) { return (a === null || a === undefined || b === null || b === undefined) ? null : a - b; }
  function fmtSec(d, signed) { return (signed ? (d < 0 ? '-' : '+') : '') + Math.abs(d).toFixed(3) + 's'; }

  // Kompakte Anzeige der Qualifikationsplätze (Anzahl = Admin-Einstellung) mit der Position des Fahrers
  function qualMeterHtml(info) {
    const q = qualifyCount;
    if (q < 1 || !qualifyKnown) return '';
    const inside = info.i < q;
    let segs = '';
    for (let k = 0; k < q; k++) segs += `<i class="qseg${inside && k === info.i ? ' me ' + info.zone : ''}"></i>`;
    const away = info.i + 1 - q;
    const text = inside ? `P${info.i + 1} / ${q}` : `${away} ${away === 1 ? 'place' : 'places'} from qualification`;
    return `<div class="qmeter"><div class="result-stat-label">Qualification</div><div class="qmeter__bar" aria-hidden="true">${segs}</div><div class="qmeter__text">${text}</div></div>`;
  }

  function findMatchesFull(query) {
    const q = query.toLowerCase();
    const out = [];
    people.forEach((p, i) => {
      if (p.name.toLowerCase().includes(q)) out.push(computeDriverInfo(i));
    });
    return out;
  }

  function applySearchFilter(val) {
    searchFilter = val.trim().toLowerCase();
    selectedDriverName = null; // manuelle Texteingabe hebt eine vorherige Auswahl auf
    updateSearchPanel();
    render(); // hält die dezente Hervorhebung innerhalb der sichtbaren Top 20 synchron
  }

  function selectDriver(name) {
    selectedDriverName = name;
    const input = document.getElementById('searchInput');
    input.value = name;
    searchFilter = name.toLowerCase();
    updateSearchPanel();
    render();
  }

  function handleSearchKeydown(e) {
    const dd = document.getElementById('searchDropdown');
    if (e.key === 'Escape') {
      dd.classList.remove('open');
    } else if ((e.key === 'Enter' || e.key === 'ArrowDown') && dd.classList.contains('open')) {
      const first = dd.querySelector('.search-dropdown-item');
      if (first) {
        e.preventDefault();
        if (e.key === 'Enter') selectDriver(first.dataset.name); else first.focus();
      }
    }
  }

  // Auswahl per Klick oder Tastatur in der Namensliste
  (function () {
    const dd = document.getElementById('searchDropdown');
    dd.addEventListener('click', (e) => {
      const item = e.target.closest('[data-name]');
      if (item) selectDriver(item.dataset.name);
    });
    dd.addEventListener('keydown', (e) => {
      const items = [...dd.querySelectorAll('.search-dropdown-item')];
      const i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' && i < items.length - 1) { e.preventDefault(); items[i + 1].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); (i > 0 ? items[i - 1] : document.getElementById('searchInput')).focus(); }
      else if (e.key === 'Enter' && i >= 0) { e.preventDefault(); selectDriver(items[i].dataset.name); }
      else if (e.key === 'Escape') { dd.classList.remove('open'); document.getElementById('searchInput').focus(); }
    });
  })();

  function renderDropdown(matches) {
    const dropdown = document.getElementById('searchDropdown');
    if (!matches.length) {
      dropdown.classList.remove('open');
      dropdown.innerHTML = '';
      return;
    }
    dropdown.innerHTML = matches.map((m) => `
      <div class="search-dropdown-item" tabindex="0" role="option" data-name="${escapeHtml(m.p.name).replace(/"/g, '&quot;')}">
        <span>${escapeHtml(m.p.name)}</span>
        <span class="sdi-pos">P${m.i + 1}</span>
      </div>
    `).join('');
    dropdown.classList.add('open');
  }

  function renderResultCard(info) {
    const container = document.getElementById('searchResultCard');
    const statusBadge = `<span class="badge badge-${info.zone}">${zoneLabel(info.zone)}</span>`;
    const gapVal = info.i === 0 ? 'Leader' : (info.toLeader === null ? '–' : fmtSec(info.toLeader, true));
    const intVal = info.i === 0 ? '—' : (info.toAhead === null ? '–' : fmtSec(info.toAhead, true));
    const pointsItem = Number.isFinite(info.p.points)
      ? `<div><div class="result-stat-label">Points</div><div class="result-stat-value">${info.p.points}</div></div>`
      : '';
    const qualItem = info.qual
      ? `<div><div class="result-stat-label">${info.qual.label}</div><div class="result-stat-value">${info.qual.value}</div></div>`
      : '';

    container.innerHTML = `
      <div class="result-card ${info.zone}">
        <div class="result-eyebrow">Your Result</div>
        <div class="result-headline">
          <div class="result-rank">P${info.i + 1}</div>
          <div class="result-name">${escapeHtml(info.p.name)}</div>
        </div>
        <div class="result-stat-grid">
          <div>
            <div class="result-stat-label">Time</div>
            <div class="result-stat-value">${formatTime(info.p.timeSec)}</div>
          </div>
          <div>
            <div class="result-stat-label">Gap to P1</div>
            <div class="result-stat-value">${gapVal}</div>
          </div>
          <div>
            <div class="result-stat-label">Interval</div>
            <div class="result-stat-value">${intVal}</div>
          </div>
          ${pointsItem}
          ${qualItem}
          <div>
            <div class="result-stat-label">Status</div>
            <div class="result-stat-value is-status">${statusBadge}</div>
          </div>
        </div>
        ${qualMeterHtml(info)}
      </div>
    `;
  }

  // Zeigt Dropdown, Ergebniskarte oder "nicht gefunden" — abhängig vom Suchzustand.
  // Wird sowohl bei Eingabe als auch bei jeder Datenaktualisierung aufgerufen, damit eine
  // bereits ausgewählte Ergebniskarte live aktuell bleibt (neue Zeit → neue Position/Status).
  function updateSearchPanel() {
    const container = document.getElementById('searchResultCard');
    const dropdown = document.getElementById('searchDropdown');

    if (!searchFilter) {
      container.innerHTML = '';
      dropdown.classList.remove('open');
      dropdown.innerHTML = '';
      return;
    }

    // Bereits ausgewählter Fahrer: direkt seine (ggf. aktualisierte) Karte zeigen, kein Dropdown
    if (selectedDriverName) {
      const idx = people.findIndex(p => p.name.toLowerCase() === selectedDriverName.toLowerCase());
      if (idx === -1) {
        container.innerHTML = '<div class="result-none">This driver is not in the ranking.</div>';
        dropdown.classList.remove('open');
        return;
      }
      renderResultCard(computeDriverInfo(idx));
      dropdown.classList.remove('open');
      return;
    }

    const matches = findMatchesFull(searchFilter);

    if (!matches.length) {
      container.innerHTML = '<div class="result-none">No driver found. Check the spelling of your name.</div>';
      dropdown.classList.remove('open');
      return;
    }

    // Eindeutiger Treffer (auch bei Teiltext) → direkt die Ergebniskarte zeigen
    if (matches.length === 1) {
      container.innerHTML = '';
      renderResultCard(matches[0]);
      dropdown.classList.remove('open');
      return;
    }

    // Mehrere Treffer → Namensliste zur Auswahl, noch keine Karte
    container.innerHTML = '';
    renderDropdown(matches);
  }

  // Index des Fahrers, dessen Ergebnis gerade gezeigt wird (ausgewählt oder eindeutiger Treffer) — sonst -1
  function getFocusedIndex() {
    if (!searchFilter) return -1;
    if (selectedDriverName) return people.findIndex(p => p.name.toLowerCase() === selectedDriverName.toLowerCase());
    const m = findMatchesFull(searchFilter);
    return m.length === 1 ? m[0].i : -1;
  }

  // Kleiner Hinweis "Best time" im Titelbalken — nur wenn mindestens eine echte Zeit vorhanden ist
  function updateBestChip() {
    const chip = document.getElementById('bestChip');
    const times = people.filter(hasTime).map(p => p.timeSec).filter(t => t > 0);
    if (!times.length) { chip.hidden = true; return; }
    chip.querySelector('b').textContent = formatTime(Math.min(...times));
    chip.hidden = false;
  }

  const MAX_VISIBLE = 20; // reine Anzeige-Grenze; die Daten bleiben vollständig erhalten

  function render() {
    const list = document.getElementById('list');
    const emptyMsg = document.getElementById('emptyMsg');
    const listHead = document.getElementById('listHead');
    list.innerHTML = '';

    // Titel: angezeigte Fahrer von allen Fahrern des Events (beide Zahlen kommen aus den Daten)
    const totalDrivers = people.length;
    document.getElementById('topLabel').textContent = totalDrivers
      ? `TOP ${Math.min(totalDrivers, MAX_VISIBLE)} OF ${totalDrivers} ${totalDrivers === 1 ? 'DRIVER' : 'DRIVERS'}`
      : 'RANKING';

    if (!people.length) {
      emptyMsg.style.display = 'block';
      emptyMsg.textContent = activeTab === 'live' ? 'Waiting for the first times.' : 'No results are stored for this event.';
      listHead.style.display = 'none';
      document.getElementById('bestChip').hidden = true;
      updateSearchPanel();
      updateHeroAndStatus(0);
      return;
    }
    emptyMsg.style.display = 'none';
    listHead.style.display = 'grid';

    let matchCount = 0;

    // Immer EINE durchgehende Rangliste (Positionen 1..N), nur die Anzeige wird auf MAX_VISIBLE begrenzt —
    // die zugrunde liegenden Daten/Positionen bleiben unverändert.
    const visiblePeople = people.slice(0, MAX_VISIBLE);
    const focusedIndex = getFocusedIndex();
    // Nicht passende Zeilen nur abdunkeln, wenn der Treffer in den sichtbaren Zeilen liegt
    const dimActive = !!searchFilter && visiblePeople.some(v => v.name.toLowerCase().includes(searchFilter));

    // Dynamische Abschnitts-Überschrift: liest ausschliesslich den bestehenden qualifyCount-Wert
    // aus der Admin-Konfiguration (einzige Quelle der Wahrheit) — kein fixer Wert.
    if (!searchFilter) {
      const qualHeader = document.createElement('div');
      qualHeader.className = 'section-label section-label--qual';
      qualHeader.textContent = `Qualification — Top ${qualifyCount}`;
      list.appendChild(qualHeader);
    }

    visiblePeople.forEach((p, i) => {
      const matchesSearch = !searchFilter || p.name.toLowerCase().includes(searchFilter);
      if (matchesSearch) matchCount++;

      if (i === qualifyCount && !searchFilter) {
        const div = document.createElement('div');
        div.className = 'zone-line zone-line--elim';
        div.setAttribute('role', 'separator');
        div.setAttribute('aria-label', 'Elimination zone');
        div.innerHTML = '<span class="zone-line__label">Elimination zone</span>';
        list.appendChild(div);
      }

      // Zone wird ausschliesslich aus dem dynamischen qualifyCount berechnet:
      // Plätze 1..qualifyCount = qualifiziert (letzter davon = "At Risk"), danach = eliminiert.
      const zone = i < qualifyCount - 1 ? 'safe' : (i === qualifyCount - 1 ? 'warn' : 'elim');
      const isP1 = i === 0 && hasTime(p);
      const timeClass = (p.timeSec === null || p.timeSec === undefined) ? 'col-time no-time' : 'col-time';

      const entry = document.createElement('div');
      entry.className = 'entry row-grid ' + zone + (isP1 ? ' p1' : '');
      const gap = i === 0 ? '' : formatGap(p.timeSec, people[i - 1].timeSec);
      const leaderGap = i === 0 ? '' : formatGap(p.timeSec, people[0].timeSec);

      // Positionswechsel seit dem vorherigen Daten-Update (nur Live; ohne Vorzustand wird nichts angezeigt)
      let arrowHtml = '<span class="pos-arrow"></span>';
      const mv = (activeTab === 'live' && liveMovement) ? liveMovement[p.name.toLowerCase()] : null;
      if (mv) {
        if (mv.isNew || mv.delta === 0) {
          arrowHtml = '<span class="pos-arrow neutral" title="No change">–</span>';
        } else if (mv.delta > 0) {
          arrowHtml = `<span class="pos-arrow up" title="Up ${mv.delta} since the last update">▲${mv.delta}</span>`;
        } else {
          arrowHtml = `<span class="pos-arrow down" title="Down ${-mv.delta} since the last update">▼${-mv.delta}</span>`;
        }
      }

      const statusBadge = `<span class="badge badge-${zone}">${zoneLabel(zone)}</span>`;
      const fastestBadge = isP1 ? '<span class="badge badge-fastest">Fastest</span>' : '';

      entry.innerHTML = `
        <div class="col-pos">${arrowHtml}<span>${i + 1}</span></div>
        <div class="col-driver">
          <div class="driver-row">
            <span class="driver-name">${escapeHtml(p.name)}</span>
            ${fastestBadge}
          </div>
          <div class="driver-meta-mobile">${gap ? 'INT ' + gap : '—'} ${statusBadge}</div>
        </div>
        <div class="col-gap${i === 0 ? ' is-leader' : ''}">${i === 0 ? 'Leader' : leaderGap}</div>
        <div class="col-int">${gap || (i === 0 ? '—' : '')}</div>
        <div class="${timeClass}">${formatTime(p.timeSec)}</div>
        <div class="col-status">${statusBadge}</div>
      `;
      if (!matchesSearch && dimActive) entry.classList.add('dimmed');
      if (i === focusedIndex) entry.classList.add('found');
      list.appendChild(entry);
    });

    updateSearchPanel();
    updateHeroAndStatus(people.length);
    updateBestChip();

    fitRows();
  }

  function fitRows() {
    const list = document.getElementById('list');
    if (!people.length) return;

    const visibleCount = Math.min(people.length, MAX_VISIBLE);
    // +1 für die "Qualification"-Kopfzeile, +1 für die "Elimination Zone"-Trennzeile (falls sichtbar)
    const totalRows = visibleCount + 1 + (qualifyCount < visibleCount ? 1 : 0);

    const top = list.getBoundingClientRect().top;
    const available = window.innerHeight - top - 24;

    // Kompakte, professionelle Zeilenhöhe statt riesiger Beamer-Schrift — passt sich
    // trotzdem noch leicht an, damit bei wenigen Fahrern nicht unnötig viel Leerraum entsteht.
    const maxRowH = window.innerWidth < 820 ? 58 : 72;
    const minRowH = 50;

    let rowH = available / totalRows;
    rowH = Math.max(minRowH, Math.min(maxRowH, rowH));
    document.documentElement.style.setProperty('--row-h', rowH + 'px');
  }

  window.addEventListener('resize', fitRows);
</script>

</body>
