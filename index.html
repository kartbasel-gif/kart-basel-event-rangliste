<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kart Basel — Qualification Ranking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --kb-bg: #0b0b0c;
    --kb-surface: #141416;
    --kb-surface-2: #1b1b1e;
    --kb-border: #26262a;
    --kb-border-soft: #1e1e21;
    --kb-text: #f3f3f4;
    --kb-text-dim: #9a9aa0;
    --kb-text-faint: #68686e;
    --kb-red: #e3121e;
    --kb-red-dim: #7a1016;
    --kb-green: #1fb15b;
    --kb-green-bg: rgba(31,177,91,0.12);
    --kb-amber: #e0912a;
    --kb-amber-bg: rgba(224,145,42,0.14);
    --kb-danger: #e3121e;
    --kb-danger-bg: rgba(227,18,30,0.12);
    --kb-purple: #9d6bff;
    --row-h: 56px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    background: var(--kb-bg);
    color: var(--kb-text);
    margin: 0;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: #0d0d0f;
    border-bottom: 1px solid var(--kb-border);
  }
  .site-header__inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand__mark {
    width: 30px; height: 30px;
    border-radius: 7px;
    background: var(--kb-red);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .brand__sub {
    font-size: 11px;
    color: var(--kb-text-faint);
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: none;
  }
  @media (min-width: 640px) {
    .brand__sub { display: inline; margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--kb-border); }
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--kb-surface);
    border: 1px solid var(--kb-border);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--kb-text-dim);
    flex-shrink: 0;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--kb-text-faint);
  }
  .status-pill.is-live { color: #bdf5d4; border-color: rgba(31,177,91,0.35); background: var(--kb-green-bg); }
  .status-pill.is-live .status-dot {
    background: var(--kb-green);
    animation: live-pulse 1.6s ease-in-out infinite;
  }
  @keyframes live-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(31,177,91,0.55); }
    50% { box-shadow: 0 0 0 4px rgba(31,177,91,0); }
  }
  .status-pill.is-final { color: #d8d8da; border-color: var(--kb-border); }

  /* ---------- Hero ---------- */
  .hero {
    border-bottom: 1px solid var(--kb-border);
    background:
      radial-gradient(900px 260px at 50% -120px, rgba(227,18,30,0.14), transparent 70%),
      #0f0f11;
  }
  .hero__inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 30px 20px 22px;
  }
  .hero__eyebrow {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--kb-red);
    margin-bottom: 8px;
  }
  .hero__title {
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 0 0 6px;
    line-height: 1.15;
  }
  .hero__meta {
    font-size: 13px;
    color: var(--kb-text-dim);
    font-weight: 500;
    margin-bottom: 18px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 600;
    color: var(--kb-text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .legend-dot {
    width: 9px; height: 9px;
    border-radius: 3px;
  }
  .legend-item.safe .legend-dot { background: var(--kb-green); }
  .legend-item.warn .legend-dot { background: var(--kb-amber); }
  .legend-item.elim .legend-dot { background: var(--kb-danger); }

  /* ---------- Main / toolbar ---------- */
  .main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 22px 20px 60px;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .tabs {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--kb-border);
  }
  .tab-btn {
    padding: 9px 4px;
    margin-right: 18px;
    border: none;
    background: none;
    color: var(--kb-text-faint);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 0.15s ease;
  }
  .tab-btn:hover { color: var(--kb-text); }
  .tab-btn::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: transparent;
    border-radius: 2px;
    transition: background 0.15s ease;
  }
  .tab-btn.active { color: var(--kb-text); }
  .tab-btn.active::after { background: var(--kb-red); }
  .tab-btn.live::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--kb-text-faint);
  }
  .tab-btn.live.active::before {
    background: var(--kb-green);
    animation: live-pulse 1.6s ease-in-out infinite;
  }

  .search-wrap { width: 100%; max-width: 320px; }
  .search-label {
    display: block;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--kb-text-faint);
    margin-bottom: 6px;
  }
  .search-field-wrap { position: relative; }
  .search-input-field {
    width: 100%;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--kb-border);
    background: var(--kb-surface);
    color: var(--kb-text);
    font-family: inherit;
    font-size: 13px;
  }
  .search-input-field::placeholder { color: var(--kb-text-faint); }
  .search-input-field:focus { outline: none; border-color: var(--kb-red); }

  .search-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 40;
    background: var(--kb-surface-2);
    border: 1px solid var(--kb-border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(0,0,0,0.5);
  }
  .search-dropdown.open { display: block; }
  .search-dropdown-item {
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--kb-text);
    cursor: pointer;
    border-bottom: 1px solid var(--kb-border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .search-dropdown-item:last-child { border-bottom: none; }
  .search-dropdown-item:hover { background: rgba(255,255,255,0.05); }
  .search-dropdown-item .sdi-pos {
    font-size: 11px;
    font-weight: 800;
    color: var(--kb-text-faint);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- "Your Result" card ---------- */
  .result-card {
    margin-bottom: 18px;
    padding: 18px 20px 16px;
    border-radius: 12px;
    background: var(--kb-surface);
    border: 1px solid var(--kb-border);
    border-left: 4px solid var(--kb-text-faint);
    animation: result-fade 0.18s ease-out;
  }
  @keyframes result-fade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: translateY(0); } }
  .result-card.safe { border-left-color: var(--kb-green); }
  .result-card.warn { border-left-color: var(--kb-amber); }
  .result-card.elim { border-left-color: var(--kb-danger); }

  .result-eyebrow {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--kb-text-faint);
    margin-bottom: 10px;
  }
  .result-headline {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .result-rank {
    font-size: 28px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .result-card.safe .result-rank { color: var(--kb-green); }
  .result-card.warn .result-rank { color: var(--kb-amber); }
  .result-card.elim .result-rank { color: var(--kb-danger); }
  .result-name { font-size: 19px; font-weight: 800; }

  .result-stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 14px;
  }
  .result-stat-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--kb-text-faint);
    margin-bottom: 3px;
  }
  .result-stat-value {
    font-size: 16px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .result-stat-value.is-status { font-size: 13px; }

  .result-none {
    text-align: center;
    color: var(--kb-text-dim);
    font-size: 13px;
    padding: 16px 0;
    border: 1px dashed var(--kb-border);
    border-radius: 12px;
    margin-bottom: 18px;
  }

  /* ---------- Table ---------- */
  .table-card {
    border: 1px solid var(--kb-border);
    border-radius: 12px;
    background: var(--kb-surface);
    overflow: hidden;
  }
  .row-grid {
    display: grid;
    grid-template-columns: 48px minmax(0,1fr) 84px 84px 108px 118px;
    column-gap: 14px;
    align-items: center;
  }
  .list-head {
    padding: 12px 18px;
    background: var(--kb-surface-2);
    border-bottom: 1px solid var(--kb-border);
    color: var(--kb-text-faint);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }
  .lh-time, .lh-gap, .lh-int { text-align: right; }
  .lh-status { text-align: right; }

  .list { display: flex; flex-direction: column; }
  .entry {
    padding: calc(var(--row-h) * 0.16) 18px;
    border-bottom: 1px solid var(--kb-border-soft);
    background: var(--kb-surface);
    transition: background 0.15s ease;
  }
  .entry:last-child { border-bottom: none; }
  .entry:hover { background: var(--kb-surface-2); }
  .entry.p1 { background: linear-gradient(90deg, rgba(157,107,255,0.07), transparent 40%); }

  .col-pos {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: calc(var(--row-h) * 0.34);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--kb-text-dim);
  }
  .entry.safe .col-pos { color: var(--kb-green); }
  .entry.warn .col-pos { color: var(--kb-amber); }
  .entry.elim .col-pos { color: var(--kb-danger); }

  .pos-arrow { font-size: calc(var(--row-h) * 0.22); font-weight: 900; line-height: 1; }
  .pos-arrow.up { color: var(--kb-green); }
  .pos-arrow.down { color: var(--kb-danger); }
  .pos-arrow.neutral { color: var(--kb-text-faint); }

  .col-driver { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .driver-row { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .driver-name {
    font-size: calc(var(--row-h) * 0.26);
    font-weight: 700;
    white-space: normal;
    word-break: break-word;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-safe { color: #bdf5d4; background: var(--kb-green-bg); }
  .badge-warn { color: #ffe2b0; background: var(--kb-amber-bg); }
  .badge-elim { color: #ffc2c6; background: var(--kb-danger-bg); }
  .badge-fastest { color: #e6dbff; background: rgba(157,107,255,0.16); }

  .driver-meta-mobile {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--kb-text-dim);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  .col-gap, .col-int {
    text-align: right;
    font-size: calc(var(--row-h) * 0.18);
    color: var(--kb-text-dim);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .col-time {
    text-align: right;
    font-size: calc(var(--row-h) * 0.26);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .col-time.no-time { color: var(--kb-text-faint); font-weight: 500; }
  .col-status { text-align: right; }

  .section-label {
    padding: 9px 18px;
    background: var(--kb-surface-2);
    border-bottom: 1px solid var(--kb-border);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .section-label--qual { color: #9fe6bd; }
  .section-label--elim { color: var(--kb-text-faint); }

  .truncate-note {
    padding: 10px 18px;
    text-align: center;
    color: var(--kb-text-faint);
    font-size: 11.5px;
    font-weight: 600;
    border-top: 1px solid var(--kb-border);
  }

  .empty {
    text-align: center;
    color: var(--kb-text-dim);
    padding: 54px 20px;
    font-size: 14px;
  }

  /* ---------- Responsive: collapse secondary columns on small screens ---------- */
  @media (max-width: 820px) {
    .row-grid { grid-template-columns: 38px minmax(0,1fr) 92px; column-gap: 10px; }
    .lh-gap, .lh-int, .lh-status, .col-gap, .col-int, .col-status { display: none; }
    .driver-meta-mobile { display: flex; }
  }

  .entry.dimmed { opacity: 0.3; }

  /* ---------- Fullscreen toggle ---------- */
  .fullscreen-btn {
    position: fixed;
    bottom: 18px;
    right: 18px;
    z-index: 60;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--kb-border);
    background: var(--kb-surface);
    color: var(--kb-text-dim);
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .fullscreen-btn:hover { color: var(--kb-text); border-color: var(--kb-red); }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <div class="brand">
      <div class="brand__mark">🏁</div>
      <div class="brand__name">KART BASEL</div>
      <div class="brand__sub">Challenge Event</div>
    </div>
    <div class="status-pill" id="statusPill"><span class="status-dot"></span><span id="statusPillLabel">Live</span></div>
  </div>
</header>

<section class="hero">
  <div class="hero__inner">
    <div class="hero__eyebrow">Qualification</div>
    <h1 class="hero__title" id="heroTitle">Live Ranking</h1>
    <div class="hero__meta" id="heroMeta">Waiting for data…</div>
    <div class="legend">
      <span class="legend-item safe"><span class="legend-dot"></span>Qualified</span>
      <span class="legend-item warn"><span class="legend-dot"></span>Cutoff / At Risk</span>
      <span class="legend-item elim"><span class="legend-dot"></span>Eliminated</span>
    </div>
  </div>
</section>

<div class="main">
  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <div class="search-wrap">
      <label class="search-label" for="searchInput">Find Your Result</label>
      <div class="search-field-wrap">
        <input id="searchInput" class="search-input-field" type="text" placeholder="🔍 Fahrer suchen…" autocomplete="off" oninput="applySearchFilter(this.value)" onkeydown="handleSearchKeydown(event)">
        <div class="search-dropdown" id="searchDropdown"></div>
      </div>
    </div>
  </div>

  <div id="searchResultCard"></div>

  <div class="table-card">
    <div class="list-head row-grid" id="listHead">
      <div class="lh-pos">Pos</div>
      <div class="lh-name">Fahrer</div>
      <div class="lh-gap">Gap</div>
      <div class="lh-int">Int</div>
      <div class="lh-time">Zeit</div>
      <div class="lh-status">Status</div>
    </div>
    <div class="list" id="list"></div>
    <div class="empty" id="emptyMsg">Warte auf Daten von der Admin-Ansicht…</div>
  </div>
</div>

<button class="fullscreen-btn" id="fsBtn" onclick="toggleFullscreen()" title="Vollbild">⛶</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAdo5UMvb5djezX6tF_78OlnwMrNl270lc",
    authDomain: "kart-basel.firebaseapp.com",
    databaseURL: "https://kart-basel-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "kart-basel",
    storageBucket: "kart-basel.firebasestorage.app",
    messagingSenderId: "633928437253",
    appId: "1:633928437253:web:4c77da7b44e7547478d66c"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const dbRef = db.ref("kartBasel/rangliste");

  let people = [];
  let livePeople = [];
  let liveQualifyCount = 7;
  let qualifyCount = 7; // aktuell aktiver Wert (je nach Tab)
  let archivedEvents = []; // [{id, name, people, qualifyCount, createdAt}]
  let activeTab = 'live'; // 'live' oder event-id
  let searchFilter = ''; // aktueller Such-Text (klein geschrieben)
  let unsubscribeLive = null;
  let lastLivePositions = {}; // name (lowercase) -> Platz (Index), fürs Erkennen von Platzwechseln im Live-Tab

  function startLiveListener() {
    if (unsubscribeLive) return;
    unsubscribeLive = true;
    dbRef.on('value', (snap) => {
      const val = snap.val();
      livePeople = (val && val.people) ? val.people : [];
      liveQualifyCount = (val && val.qualifyCount) ? val.qualifyCount : 7;
      if (livePeople.length === 0) {
        lastLivePositions = {}; // neue Runde beginnt, alte Platzstände verwerfen
      }
      if (activeTab === 'live') {
        people = livePeople;
        qualifyCount = liveQualifyCount;
        render();
      }
    }, (err) => {
      console.error('Firebase-Fehler (live):', err);
    });
  }

  function loadArchivedEvents() {
    db.ref('kartBaselEvents').on('value', (snap) => {
      archivedEvents = [];
      snap.forEach((child) => {
        archivedEvents.push({ id: child.key, ...child.val() });
      });
      archivedEvents.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      renderTabs();
      if (activeTab !== 'live') render(); // falls gerade ein archiviertes Event offen ist, Meta-Infos ggf. aktualisieren
    }, (err) => {
      console.error('Firebase-Fehler (Archiv):', err);
    });
  }

  function renderTabs() {
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = '';

    const liveBtn = document.createElement('button');
    liveBtn.className = 'tab-btn live' + (activeTab === 'live' ? ' active' : '');
    liveBtn.textContent = 'Live';
    liveBtn.onclick = () => selectTab('live');
    tabsEl.appendChild(liveBtn);

    archivedEvents.forEach((ev) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (activeTab === ev.id ? ' active' : '');
      btn.textContent = ev.name;
      btn.onclick = () => selectTab(ev.id);
      tabsEl.appendChild(btn);
    });
  }

  function selectTab(tabId) {
    activeTab = tabId;
    if (tabId === 'live') {
      people = livePeople;
      qualifyCount = liveQualifyCount;
    } else {
      const ev = archivedEvents.find(e => e.id === tabId);
      people = ev ? (ev.people || []) : [];
      qualifyCount = ev && ev.qualifyCount ? ev.qualifyCount : 7;
    }
    renderTabs();
    render();
  }

  function toggleFullscreen() {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    } else {
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    }
  }

  function formatTime(sec) {
    if (sec === null || sec === undefined) return '–';
    const min = Math.floor(sec / 60);
    const rest = (sec - min * 60);
    if (min > 0) {
      return min + ':' + rest.toFixed(3).padStart(6, '0');
    }
    return rest.toFixed(3) + 's';
  }

  // Abstand zum Vordermann (z.B. "+0.523")
  function formatGap(currentSec, prevSec) {
    if (currentSec === null || currentSec === undefined) return '';
    if (prevSec === null || prevSec === undefined) return '';
    const gap = currentSec - prevSec;
    if (gap <= 0) return '';
    return '+' + gap.toFixed(3);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function zoneLabel(zone) {
    if (zone === 'safe') return 'Qualified';
    if (zone === 'warn') return 'Qualified · Cutoff';
    return 'Eliminated';
  }

  // Aktualisiert Titel/Status im Hero-Bereich oben — rein darstellend, ändert keine Logik
  function updateHeroAndStatus(driverCount) {
    const pill = document.getElementById('statusPill');
    const pillLabel = document.getElementById('statusPillLabel');
    const title = document.getElementById('heroTitle');
    const meta = document.getElementById('heroMeta');

    if (activeTab === 'live') {
      pill.className = 'status-pill is-live';
      pillLabel.textContent = 'Live';
      title.textContent = 'Live Qualifying';
      meta.textContent = driverCount
        ? `${driverCount} Fahrer im Feld · Top ${qualifyCount} qualifizieren sich`
        : 'Warte auf die ersten Zeiten…';
    } else {
      const ev = archivedEvents.find(e => e.id === activeTab);
      pill.className = 'status-pill is-final';
      pillLabel.textContent = 'Final';
      title.textContent = ev ? ev.name : 'Ergebnis';
      const dateStr = ev && ev.createdAt ? new Date(ev.createdAt).toLocaleDateString('de-CH') : '';
      meta.textContent = `${dateStr ? dateStr + ' · ' : ''}${driverCount} Fahrer · Top ${qualifyCount} qualifiziert — Endergebnis`;
    }
  }

  startLiveListener();
  loadArchivedEvents();
  renderTabs();

  // ---- "Find Your Result" Suche ----
  // Arbeitet IMMER auf der vollständigen people-Liste (nicht nur den sichtbaren Top 20),
  // damit auch Fahrer ausserhalb der Top 20 ihr eigenes Ergebnis finden können.
  // Es gibt keine separate Datenquelle — dieselbe Berechnung (zone/gap/leaderGap) wie in render().

  let selectedDriverName = null; // exakter Name, sobald aus dem Dropdown ausgewählt

  function computeDriverInfo(index) {
    const p = people[index];
    const zone = index < qualifyCount - 1 ? 'safe' : (index === qualifyCount - 1 ? 'warn' : 'elim');
    const gap = index === 0 ? '' : formatGap(p.timeSec, people[index - 1].timeSec);
    const leaderGap = index === 0 ? '' : formatGap(p.timeSec, people[0].timeSec);
    return { p, i: index, zone, gap, leaderGap };
  }

  function findMatchesFull(query) {
    const q = query.toLowerCase();
    const out = [];
    people.forEach((p, i) => {
      if (p.name.toLowerCase().includes(q)) out.push(computeDriverInfo(i));
    });
    return out;
  }

  function applySearchFilter(val) {
    searchFilter = val.trim().toLowerCase();
    selectedDriverName = null; // manuelle Texteingabe hebt eine vorherige Auswahl auf
    updateSearchPanel();
    render(); // hält die dezente Hervorhebung innerhalb der sichtbaren Top 20 synchron
  }

  function selectDriver(name) {
    selectedDriverName = name;
    const input = document.getElementById('searchInput');
    input.value = name;
    searchFilter = name.toLowerCase();
    updateSearchPanel();
    render();
  }

  function handleSearchKeydown(e) {
    if (e.key === 'Escape') {
      document.getElementById('searchDropdown').classList.remove('open');
    }
  }

  function renderDropdown(matches) {
    const dropdown = document.getElementById('searchDropdown');
    if (!matches.length) {
      dropdown.classList.remove('open');
      dropdown.innerHTML = '';
      return;
    }
    dropdown.innerHTML = matches.map((m) => `
      <div class="search-dropdown-item" onclick="selectDriver('${escapeHtml(m.p.name).replace(/'/g, "\\'")}')">
        <span>${escapeHtml(m.p.name)}</span>
        <span class="sdi-pos">P${m.i + 1}</span>
      </div>
    `).join('');
    dropdown.classList.add('open');
  }

  function renderResultCard(info) {
    const container = document.getElementById('searchResultCard');
    const statusBadge = `<span class="badge badge-${info.zone}">${zoneLabel(info.zone)}</span>`;
    const gapVal = info.leaderGap || (info.i === 0 ? '—' : '');
    const intVal = info.gap || (info.i === 0 ? '—' : '');

    container.innerHTML = `
      <div class="result-card ${info.zone}">
        <div class="result-eyebrow">Your Result</div>
        <div class="result-headline">
          <div class="result-rank">P${info.i + 1}</div>
          <div class="result-name">${escapeHtml(info.p.name)}</div>
        </div>
        <div class="result-stat-grid">
          <div>
            <div class="result-stat-label">Time</div>
            <div class="result-stat-value">${formatTime(info.p.timeSec)}</div>
          </div>
          <div>
            <div class="result-stat-label">Gap</div>
            <div class="result-stat-value">${gapVal}</div>
          </div>
          <div>
            <div class="result-stat-label">Interval</div>
            <div class="result-stat-value">${intVal}</div>
          </div>
          <div>
            <div class="result-stat-label">Status</div>
            <div class="result-stat-value is-status">${statusBadge}</div>
          </div>
        </div>
      </div>
    `;
  }

  // Zeigt Dropdown, Ergebniskarte oder "nicht gefunden" — abhängig vom Suchzustand.
  // Wird sowohl bei Eingabe als auch bei jeder Datenaktualisierung aufgerufen, damit eine
  // bereits ausgewählte Ergebniskarte live aktuell bleibt (neue Zeit → neue Position/Status).
  function updateSearchPanel() {
    const container = document.getElementById('searchResultCard');
    const dropdown = document.getElementById('searchDropdown');

    if (!searchFilter) {
      container.innerHTML = '';
      dropdown.classList.remove('open');
      dropdown.innerHTML = '';
      return;
    }

    // Bereits ausgewählter Fahrer: direkt seine (ggf. aktualisierte) Karte zeigen, kein Dropdown
    if (selectedDriverName) {
      const idx = people.findIndex(p => p.name.toLowerCase() === selectedDriverName.toLowerCase());
      if (idx === -1) {
        container.innerHTML = '<div class="result-none">Fahrer nicht gefunden.</div>';
        dropdown.classList.remove('open');
        return;
      }
      renderResultCard(computeDriverInfo(idx));
      dropdown.classList.remove('open');
      return;
    }

    const matches = findMatchesFull(searchFilter);

    if (!matches.length) {
      container.innerHTML = '<div class="result-none">Kein Fahrer gefunden.</div>';
      dropdown.classList.remove('open');
      return;
    }

    // Eindeutiger Treffer (auch bei Teiltext) → direkt die Ergebniskarte zeigen
    if (matches.length === 1) {
      container.innerHTML = '';
      renderResultCard(matches[0]);
      dropdown.classList.remove('open');
      return;
    }

    // Mehrere Treffer → Namensliste zur Auswahl, noch keine Karte
    container.innerHTML = '';
    renderDropdown(matches);
  }

  const MAX_VISIBLE = 20;

  function render() {
    const list = document.getElementById('list');
    const emptyMsg = document.getElementById('emptyMsg');
    const listHead = document.getElementById('listHead');
    list.innerHTML = '';

    if (!people.length) {
      emptyMsg.style.display = 'block';
      emptyMsg.textContent = 'Warte auf Daten von der Admin-Ansicht…';
      listHead.style.display = 'none';
      updateHeroAndStatus(0);
      return;
    }
    emptyMsg.style.display = 'none';
    listHead.style.display = 'grid';

    let matchCount = 0;

    // Immer EINE durchgehende Rangliste (Positionen 1..N), nur die Anzeige wird auf 25 begrenzt —
    // die zugrunde liegenden Daten/Positionen bleiben unverändert.
    const visiblePeople = people.slice(0, MAX_VISIBLE);

    // Dynamische Abschnitts-Überschrift: liest ausschliesslich den bestehenden qualifyCount-Wert
    // aus der Admin-Konfiguration (einzige Quelle der Wahrheit) — kein fixer Wert.
    if (!searchFilter) {
      const qualHeader = document.createElement('div');
      qualHeader.className = 'section-label section-label--qual';
      qualHeader.textContent = `Qualification — Top ${qualifyCount}`;
      list.appendChild(qualHeader);
    }

    visiblePeople.forEach((p, i) => {
      const matchesSearch = !searchFilter || p.name.toLowerCase().includes(searchFilter);
      if (matchesSearch) matchCount++;

      if (i === qualifyCount && !searchFilter) {
        const div = document.createElement('div');
        div.className = 'section-label section-label--elim';
        div.textContent = 'Elimination Zone';
        list.appendChild(div);
      }

      // Zone wird ausschliesslich aus dem dynamischen qualifyCount berechnet:
      // Plätze 1..qualifyCount = qualifiziert (letzter davon = Cutoff-Markierung), danach = eliminiert.
      const zone = i < qualifyCount - 1 ? 'safe' : (i === qualifyCount - 1 ? 'warn' : 'elim');
      const isP1 = i === 0 && p.timeSec !== null;
      const timeClass = (p.timeSec === null || p.timeSec === undefined) ? 'col-time no-time' : 'col-time';

      const entry = document.createElement('div');
      entry.className = 'entry row-grid ' + zone + (isP1 ? ' p1' : '');
      const gap = i === 0 ? '' : formatGap(p.timeSec, people[i - 1].timeSec);
      const leaderGap = i === 0 ? '' : formatGap(p.timeSec, people[0].timeSec);

      // Platzwechsel-Pfeil (nur im Live-Tab sinnvoll, da archivierte Events ein fixer Endstand sind)
      let arrowHtml = '';
      if (activeTab === 'live') {
        const prevIndex = lastLivePositions[p.name.toLowerCase()];
        if (prevIndex === undefined || i === prevIndex) {
          arrowHtml = '<span class="pos-arrow neutral">–</span>';
        } else if (i < prevIndex) {
          arrowHtml = '<span class="pos-arrow up">▲</span>';
        } else {
          arrowHtml = '<span class="pos-arrow down">▼</span>';
        }
      }

      const statusBadge = `<span class="badge badge-${zone}">${zoneLabel(zone)}</span>`;
      const fastestBadge = isP1 ? '<span class="badge badge-fastest">Fastest</span>' : '';

      entry.innerHTML = `
        <div class="col-pos">${arrowHtml}<span>${i + 1}</span></div>
        <div class="col-driver">
          <div class="driver-row">
            <span class="driver-name">${escapeHtml(p.name)}</span>
            ${fastestBadge}
          </div>
          <div class="driver-meta-mobile">${gap ? 'INT ' + gap : '—'} ${statusBadge}</div>
        </div>
        <div class="col-gap">${leaderGap || (i === 0 ? '—' : '')}</div>
        <div class="col-int">${gap || (i === 0 ? '—' : '')}</div>
        <div class="${timeClass}">${formatTime(p.timeSec)}</div>
        <div class="col-status">${statusBadge}</div>
      `;
      if (!matchesSearch) entry.classList.add('dimmed');
      list.appendChild(entry);
    });

    if (!searchFilter && people.length > MAX_VISIBLE) {
      const note = document.createElement('div');
      note.className = 'truncate-note';
      note.textContent = `Top ${MAX_VISIBLE} von ${people.length} Fahrern angezeigt`;
      list.appendChild(note);
    }

    updateSearchPanel();
    updateHeroAndStatus(people.length);

    if (searchFilter && matchCount === 0) {
      emptyMsg.style.display = 'block';
      emptyMsg.textContent = `Kein Fahrer gefunden für "${searchFilter}".`;
    }

    // Aktuelle Positionen merken, damit beim nächsten Update Platzwechsel erkannt werden können
    if (activeTab === 'live') {
      const newPositions = {};
      people.forEach((p, i) => { newPositions[p.name.toLowerCase()] = i; });
      lastLivePositions = newPositions;
    }

    fitRows();
  }

  function fitRows() {
    const list = document.getElementById('list');
    if (!people.length) return;

    const visibleCount = Math.min(people.length, MAX_VISIBLE);
    // +1 für die "Qualification"-Kopfzeile, +1 für die "Elimination Zone"-Trennzeile (falls sichtbar)
    const totalRows = visibleCount + 1 + (qualifyCount < visibleCount ? 1 : 0);

    const top = list.getBoundingClientRect().top;
    const available = window.innerHeight - top - 24;

    // Kompakte, professionelle Zeilenhöhe statt riesiger Beamer-Schrift — passt sich
    // trotzdem noch leicht an, damit bei wenigen Fahrern nicht unnötig viel Leerraum entsteht.
    const maxRowH = window.innerWidth < 820 ? 58 : 72;
    const minRowH = 40;

    let rowH = available / totalRows;
    rowH = Math.max(minRowH, Math.min(maxRowH, rowH));
    document.documentElement.style.setProperty('--row-h', rowH + 'px');
  }

  window.addEventListener('resize', fitRows);
</script>

</body>
